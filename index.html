<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Serif SC", serif;
    background: #0a0a0a;
    color: #e0d8c8;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
}
.container {
    max-width: 430px;
    margin: 0 auto;
    background: #141414;
    min-height: 100vh;
}

/* --- Hero Banner --- */
.hero {
    padding: 28px 20px 0;
    text-align: center;
    position: relative;
}
.hero-label {
    font-size: 9px;
    letter-spacing: 5px;
    color: rgba(212,175,55,0.6);
    text-transform: uppercase;
    margin-bottom: 8px;
}
.hero-title {
    font-family: "Noto Serif SC", "STSong", Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    color: #f0e6cf;
    letter-spacing: 2px;
    margin-bottom: 6px;
}
.hero-sub {
    font-size: 12px;
    color: rgba(224,216,200,0.35);
    font-style: italic;
    margin-bottom: 4px;
}
.hero-count {
    font-size: 10px;
    letter-spacing: 1px;
    color: #d4af37;
    margin-bottom: 6px;
}

/* --- Featured Banner Carousel --- */
.banner-section {
    padding: 20px 16px 8px;
}
.banner-section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px; padding: 0 4px;
}
.banner-section-line {
    width: 20px; height: 0.5px; background: #d4af37;
}
.banner-section-label {
    font-size: 10px; letter-spacing: 3px;
    color: #d4af37; text-transform: uppercase;
}
.banner-carousel-wrap {
    position: relative; width: 100%; overflow: hidden;
    border-radius: 2px;
}
.banner-carousel {
    display: flex;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    touch-action: pan-y;
}
.banner-slide {
    min-width: 100%;
}
.banner-slide a {
    display: block; text-decoration: none;
}
.banner-slide img {
    width: 100%; height: auto; display: block;
    object-fit: cover;
}
.banner-dots {
    display: flex; justify-content: center; gap: 8px;
    padding: 12px 0 0;
}
.banner-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: all 0.35s; cursor: pointer;
}
.banner-dot.active {
    width: 20px; border-radius: 3px;
    background: #d4af37;
}

/* --- Category Nav --- */
.cat-nav {
    display: flex; gap: 0; padding: 20px 16px 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.cat-nav::-webkit-scrollbar { display: none; }
.cat-item {
    flex-shrink: 0;
    padding: 6px 16px;
    font-size: 12px; color: rgba(224,216,200,0.4);
    cursor: pointer; letter-spacing: 1px;
    border-bottom: 1px solid transparent;
    transition: all 0.25s;
}
.cat-item.active {
    color: #d4af37;
    border-bottom-color: #d4af37;
}

/* --- Section Title --- */
.section-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 20px 16px;
}
.section-line { width: 20px; height: 0.5px; background: #d4af37; }
.section-label {
    font-size: 10px; letter-spacing: 3px; color: #d4af37;
    text-transform: uppercase;
}
.section-num {
    font-size: 10px; color: rgba(224,216,200,0.2);
    margin-left: auto;
}

/* --- Product Grid --- */
.product-grid {
    padding: 0 16px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.product-card {
    background: rgba(255,255,255,0.02);
    border: 0.5px solid rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    text-decoration: none; color: inherit;
    transition: border-color 0.3s;
    position: relative;
}
.product-card:hover, .product-card:active {
    border-color: rgba(212,175,55,0.3);
}
.product-card-img {
    width: 100%;
    aspect-ratio: 1;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
.product-card-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s;
}
.product-card:hover .product-card-img img {
    transform: scale(1.04);
}
.product-badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 9px; letter-spacing: 2px;
    padding: 2px 8px; border-radius: 2px;
    font-weight: 500; z-index: 2;
}
.badge-new {
    background: #d4af37; color: #0a0a0a;
}
.badge-hot {
    background: rgba(255,255,255,0.08); color: rgba(224,216,200,0.6);
    border: 0.5px solid rgba(255,255,255,0.1);
}
.badge-premium {
    background: rgba(212,175,55,0.12); color: #d4af37;
    border: 0.5px solid rgba(212,175,55,0.2);
}
.product-card-info {
    padding: 10px 12px 12px;
}
.product-card-title {
    font-size: 12px; font-weight: 400; color: #e0d8c8;
    line-height: 1.4; margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.product-card-price {
    font-size: 15px; font-weight: 400;
    color: #d4af37;
    font-family: "Noto Serif SC", Georgia, serif;
}
.product-card-price-sym {
    font-size: 11px; color: rgba(212,175,55,0.6);
    margin-right: 2px;
}

/* --- Footer --- */
.footer {
    text-align: center; padding: 32px 16px;
    font-size: 10px; color: rgba(224,216,200,0.2);
    letter-spacing: 2px;
}
.gold-line {
    height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
    margin: 16px 20px;
}

.hidden { display: none !important; }
</style>
</head>

{title:"乌木沉香持久香薰", price:"99", cat:"生活", link:"乌木沉香持久香薰 室内除异味香氛/h5-poster.html", img:"乌木沉香持久香薰 室内除异味香氛/主图/01_主图 1：点击主图.png", badge:"new", isNew:true},

];

var currentCat = 'all';

function renderProducts(cat) {
    var grid = document.getElementById('productGrid');
    var items = PRODUCTS;
    if (cat === 'new') {
        items = PRODUCTS.filter(function(p) { return p.isNew; });
    } else if (cat !== 'all') {
        items = PRODUCTS.filter(function(p) { return p.cat === cat; });
    }

    var html = '';
    items.forEach(function(p) {
        var badgeHtml = '';
        if (p.badge === 'new') badgeHtml = '<span class="product-badge badge-new">NEW</span>';
        else if (p.badge === 'hot') badgeHtml = '<span class="product-badge badge-hot">HOT</span>';
        else if (p.badge === 'premium') badgeHtml = '<span class="product-badge badge-premium">PREMIUM</span>';

        html += '<a href="' + p.link + '" class="product-card">';
        html += '<div class="product-card-img">';
        html += '<img src="' + p.img + '" alt="' + p.title + '" loading="lazy" onerror="this.src=\\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%231a1a1a%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E\'">';
        html += badgeHtml;
        html += '</div>';
        html += '<div class="product-card-info">';
        html += '<div class="product-card-title">' + p.title + '</div>';
        html += '<div class="product-card-price"><span class="product-card-price-sym">&yen;</span>' + p.price + '</div>';
        html += '</div>';
        html += '</a>';
    });

    grid.innerHTML = html;
    document.getElementById('sectionNum').textContent = items.length + ' ITEMS';

    var label = cat === 'all' ? 'All Products' : cat === 'new' ? 'New In' : cat;
    document.getElementById('sectionLabel').textContent = label;
}

document.getElementById('catNav').addEventListener('click', function(e) {
    if (!e.target.classList.contains('cat-item')) return;
    currentCat = e.target.dataset.cat;
    var items = document.querySelectorAll('.cat-item');
    items.forEach(function(i) { i.classList.remove('active'); });
    e.target.classList.add('active');
    renderProducts(currentCat);
});

renderProducts('all');

(function() {
    var carousel = document.getElementById('bannerCarousel');
    var dots = document.querySelectorAll('.banner-dot');
    var slides = document.querySelectorAll('.banner-slide');
    var current = 0;
    var startX = 0;

    function goTo(index) {
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        current = index;
        carousel.style.transform = 'translateX(-' + (current * 100) + '%)';
        dots.forEach(function(d, i) { d.classList.toggle('active', i === current); });
    }

    dots.forEach(function(dot, i) {
        dot.addEventListener('click', function() { goTo(i); });
    });

    carousel.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
    }, {passive: true});

    carousel.addEventListener('touchend', function(e) {
        var diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) goTo(current + 1); else goTo(current - 1);
        }
    }, {passive: true});

    setInterval(function() { goTo(current + 1); }, 5000);
})();
</script>
