<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>修身连体运动服</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Serif SC", "Helvetica Neue", serif;
    background: #0a0a0a;
    color: #e0d8c8;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
}
.container {
    max-width: 430px;
    margin: 0 auto;
    background: #141414;
    min-height: 100vh;
    position: relative;
    padding-bottom: 80px;
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(20,20,20,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid rgba(212,175,55,0.15);
}
.header-title {
    font-size: 15px;
    font-weight: 500;
    color: #e0d8c8;
    letter-spacing: 0.5px;
}
.header-back {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    color: #e0d8c8; font-size: 16px; cursor: pointer; border: none;
}
.header-share {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(212,175,55,0.12);
    display: flex; align-items: center; justify-content: center;
    color: #d4af37; font-size: 14px; cursor: pointer; border: none;
}

.carousel-wrap {
    position: relative; width: 100%; overflow: hidden;
    background: #0a0a0a;
}
.carousel {
    display: flex;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    touch-action: pan-y;
}
.slide {
    min-width: 100%; display: flex;
    align-items: center; justify-content: center;
    padding: 16px;
}
.slide img {
    width: 100%; max-height: 420px;
    object-fit: contain;
    border-radius: 4px;
}
.carousel-dots {
    display: flex; justify-content: center; gap: 8px;
    padding: 10px 0 16px;
}
.dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.35s; cursor: pointer;
}
.dot.active {
    width: 20px; border-radius: 3px;
    background: #d4af37;
}

.gold-line {
    height: 0.5px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent);
    margin: 0 20px;
}

.info-section {
    padding: 20px;
}
.label-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}
.section-label {
    font-size: 10px; letter-spacing: 3px; color: #d4af37; text-transform: uppercase;
}
.new-badge {
    font-size: 10px; letter-spacing: 2px; color: #0a0a0a; background: #d4af37;
    padding: 2px 8px; border-radius: 2px; font-weight: 500;
}
.product-title {
    font-family: "Noto Serif SC", "STSong", Georgia, serif;
    font-size: 22px; font-weight: 500; color: #f0e6cf;
    line-height: 1.3; margin-bottom: 8px; letter-spacing: 1px;
}
.product-subtitle {
    font-size: 13px; color: rgba(224,216,200,0.5);
    line-height: 1.5; margin-bottom: 16px; font-style: italic;
}
.price-row {
    display: flex; align-items: baseline; gap: 6px; margin-bottom: 14px;
}
.price-symbol { font-size: 16px; color: #d4af37; font-weight: 400; }
.price {
    font-size: 34px; font-weight: 400; color: #d4af37;
    letter-spacing: -1px; font-family: "Noto Serif SC", Georgia, serif;
}
.price-original {
    font-size: 13px; color: rgba(224,216,200,0.3); text-decoration: line-through; margin-left: 6px;
}
.tags {
    display: flex; flex-wrap: wrap; gap: 8px;
}
.tag {
    padding: 5px 12px;
    background: rgba(212,175,55,0.08);
    border: 0.5px solid rgba(212,175,55,0.2);
    border-radius: 2px; font-size: 11px; color: #d4af37;
    letter-spacing: 0.5px;
}

.trust-section {
    margin: 4px 20px 20px; padding: 16px 20px;
    background: rgba(255,255,255,0.02);
    border: 0.5px solid rgba(212,175,55,0.1);
    display: flex; justify-content: space-around;
}
.trust-item { text-align: center; }
.trust-icon { font-size: 18px; margin-bottom: 4px; opacity: 0.6; }
.trust-text { font-size: 10px; color: rgba(224,216,200,0.4); }

.section-divider {
    height: 8px; background: #0a0a0a;
}

.detail-section { padding: 24px 0; }
.section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px 16px;
}
.section-header-line {
    width: 24px; height: 0.5px; background: #d4af37;
}
.section-title {
    font-size: 11px; font-weight: 400; letter-spacing: 3px;
    color: #d4af37; text-transform: uppercase;
}
.detail-img-wrap { width: 100%; margin-bottom: 1px; }
.detail-img-wrap img { width: 100%; display: block; }

.long-image-section { padding: 20px 16px; }
.long-image-section img { width: 100%; border-radius: 2px; }

.cta-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(20,20,20,0.97);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(212,175,55,0.15);
    padding: 10px 16px 14px;
    display: flex; gap: 10px; align-items: center;
    z-index: 200;
}
.btn-icon {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: rgba(224,216,200,0.5); cursor: pointer;
    padding: 4px 6px; font-family: inherit;
}
.btn-icon .bi { font-size: 18px; }
.btn-icon span:last-child { font-size: 10px; }
.btn-cart {
    flex: 1; height: 42px; border-radius: 2px;
    border: 0.5px solid rgba(212,175,55,0.3);
    background: transparent; color: #d4af37;
    font-size: 14px; font-weight: 400; letter-spacing: 1px;
    cursor: pointer; font-family: inherit;
}
.btn-buy {
    flex: 1.5; height: 42px; border-radius: 2px; border: none;
    background: linear-gradient(135deg, #c8a030, #d4af37);
    color: #0a0a0a; font-size: 14px; font-weight: 500; letter-spacing: 1px;
    cursor: pointer; font-family: inherit;
}

.reveal {
    opacity: 0; transform: translateY(20px);
    transition: all 0.6s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="container">

    <div class="header">
        <button class="header-back" onclick="history.back()">&larr;</button>
        <div class="header-title">修身连体运动服</div>
        <div class="header-share">&#10247;</div>
    </div>

    <div class="carousel-wrap">
        <div class="carousel" id="carousel">
            <div class="slide"><img src="主图/01_1.jpg" alt="主图1"></div><div class="slide"><img src="主图/02_2.jpg" alt="主图2"></div><div class="slide"><img src="主图/03_3.jpg" alt="主图3"></div><div class="slide"><img src="主图/04_4.jpg" alt="主图4"></div><div class="slide"><img src="主图/05_5.jpg" alt="主图5"></div>
        </div>
        <div class="carousel-dots" id="dots">
            <span class="dot active" data-index="0"></span><span class="dot " data-index="1"></span><span class="dot " data-index="2"></span><span class="dot " data-index="3"></span><span class="dot " data-index="4"></span>
        </div>
    </div>

    <div class="info-section">
        <div class="label-row">
            <span class="section-label">FEATURED PRODUCT</span>
            
        </div>
        <h1 class="product-title">修身连体运动服</h1>
        <p class="product-subtitle">弹力亲肤 · 运动塑形一体式</p>
        <div class="price-row">

        </div>
        <div class="tags">
            <span class="tag">连体</span><span class="tag">运动</span><span class="tag">弹力</span><span class="tag">塑形</span>
        </div>
    </div>

    <div class="gold-line"></div>

    <div class="trust-section">
        <div class="trust-item">
            <div class="trust-icon">&#9992;</div>
            <div class="trust-text">极速发货</div>
        </div>
        <div class="trust-item">
            <div class="trust-icon">&#9733;</div>
            <div class="trust-text">正品保障</div>
        </div>
        <div class="trust-item">
            <div class="trust-icon">&#8635;</div>
            <div class="trust-text">七天退换</div>
        </div>
        <div class="trust-item">
            <div class="trust-icon">&#9670;</div>
            <div class="trust-text">品质严选</div>

    <div class="detail-section">
        <div class="section-header">

        <div class="detail-img-wrap"><img src="详情图/06_01.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/07_02.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/08_03.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/09_04.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/10_05.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/11_06.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/12_07.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/13_08.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/14_09.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/15_10.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/16_11.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/17_12.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/18_13.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/19_14.jpg" alt="详情图" loading="lazy"></div><div class="detail-img-wrap"><img src="详情图/20_15.jpg" alt="详情图" loading="lazy"></div>

    <div style="height: 40px;"></div>

</div>

<div class="cta-bar">
    <button class="btn-icon">
        <span class="bi">&#9993;</span>

    </button>
    <button class="btn-icon">
        <span class="bi">&#9737;</span>
        <span>收藏</span>
    </button>
    <button class="btn-cart">加入购物车</button>
    <button class="btn-buy">立即购买</button>
</div>

<script>
(function() {
    var carousel = document.getElementById('carousel');
    var dots = document.querySelectorAll('.dot');
    var slides = document.querySelectorAll('.slide');
    var current = 0;
    var startX = 0;

    function goTo(index) {
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        current = index;
        carousel.style.transform = 'translateX(-' + (current * 100) + '%)';
        dots.forEach(function(d, i) { d.classList.toggle('active', i === current); });
    }

    dots.forEach(function(dot, i) {
        dot.addEventListener('click', function() { goTo(i); });
    });

    carousel.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
    }, {passive: true});

    carousel.addEventListener('touchend', function(e) {
        var diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) goTo(current + 1); else goTo(current - 1);
        }
    }, {passive: true});

    setInterval(function() { goTo(current + 1); }, 4500);

    var reveals = document.querySelectorAll('.reveal');
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.1 });
    reveals.forEach(function(r) { observer.observe(r); });
})();
</script>

</body>
</html>
