<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天然蜜蜡国风项链</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
}
.container {
    max-width: 430px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    position: relative;
    padding-bottom: 80px;
}

/* Header */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
}
.header-title {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
}
.header-back {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #f5f5f5;
    display: flex; align-items: center; justify-content: center;
    color: #666; font-size: 16px; cursor: pointer; border: none;
}
.header-share {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #f5f5f5;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 14px; cursor: pointer; border: none;
}

/* Carousel */
.carousel-wrap {
    position: relative; width: 100%; overflow: hidden;
    background: #fafafa;
}
.carousel {
    display: flex;
    transition: transform 0.4s ease;
    touch-action: pan-y;
}
.slide {
    min-width: 100%; display: flex;
    align-items: center; justify-content: center;
}
.slide img {
    width: 100%; height: auto;
    display: block;
}
.carousel-dots {
    display: flex; justify-content: center; gap: 6px;
    padding: 10px 0;
    background: #fafafa;
}
.dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #ddd;
    transition: all 0.3s; cursor: pointer;
}
.dot.active {
    width: 18px; border-radius: 3px;
    background: #e60012;
}

/* Product Info */
.info-section {
    padding: 16px;
    background: #fff;
}
.new-badge {
    display: inline-block;
    font-size: 11px; font-weight: 600; color: #fff; background: #e60012;
    padding: 2px 8px; border-radius: 3px; margin-bottom: 10px;
    letter-spacing: 0.5px;
}
.product-title {
    font-size: 20px; font-weight: 600; color: #1a1a1a;
    line-height: 1.4; margin-bottom: 6px;
}
.product-subtitle {
    font-size: 13px; color: #999;
    line-height: 1.4; margin-bottom: 14px;
}
.price-row {
    display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px;
}
.price-symbol { font-size: 14px; color: #e60012; font-weight: 600; }
.price {
    font-size: 28px; font-weight: 700; color: #e60012;
    letter-spacing: -1px;
}
.tags {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
}
.tag {
    padding: 5px 12px;
    background: #fff5f5;
    border: 1px solid #ffd6d6;
    border-radius: 12px; font-size: 12px; color: #e60012;
}

/* Divider */
.section-gap {
    height: 10px; background: #f5f5f5;
}

/* Trust Badges */
.trust-section {
    padding: 16px;
    background: #fff;
    display: flex; justify-content: space-around;
    border-top: 1px solid #f5f5f5;
    border-bottom: 1px solid #f5f5f5;
}
.trust-item { text-align: center; }
.trust-icon { font-size: 20px; margin-bottom: 4px; }
.trust-text { font-size: 11px; color: #999; }

/* Detail Section */
.detail-section { padding: 0; }
.detail-header {
    text-align: center; padding: 20px 16px 12px;
}
.detail-header-title {
    font-size: 16px; font-weight: 600; color: #1a1a1a;
    position: relative; display: inline-block;
}
.detail-header-title::before,
.detail-header-title::after {
    content: "";
    position: absolute; top: 50%;
    width: 30px; height: 1px; background: #ddd;
}
.detail-header-title::before { left: -40px; }
.detail-header-title::after { right: -40px; }
.detail-img-wrap { width: 100%; }
.detail-img-wrap img { width: 100%; display: block; }

/* Long Image */
.long-image-section { padding: 0; }
.long-image-section img { width: 100%; display: block; }

/* Bottom CTA Bar */
.cta-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; align-items: center;
    z-index: 200;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
}
.btn-icon {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: #999; cursor: pointer;
    padding: 4px 6px; font-family: inherit;
}
.btn-icon .bi { font-size: 20px; line-height: 1; }
.btn-icon span:last-child { font-size: 10px; }
.btn-cart {
    flex: 1; height: 42px; border-radius: 21px;
    border: 1px solid #e60012;
    background: #fff; color: #e60012;
    font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
}
.btn-buy {
    flex: 1.5; height: 42px; border-radius: 21px; border: none;
    background: linear-gradient(135deg, #ff4757, #e60012);
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
}
</style>
</head>
<body>
<div class="container">

    <div class="header">

        <div class="header-title">商品详情</div>
        <div class="header-share">&#10247;</div>

    <div class="carousel-wrap">
        <div class="carousel" id="carousel">
            <div class="slide"><img src="主图/01_主图 1：点击主图.png" alt="主图1"></div><div class="slide"><img src="主图/02_主图 2：佩戴展示.png" alt="主图2"></div><div class="slide"><img src="主图/03_主图 3：核心卖点.png" alt="主图3"></div><div class="slide"><img src="主图/04_主图 4：场景展示.png" alt="主图4"></div><div class="slide"><img src="主图/05_主图 5：综合决策主图.png" alt="主图5"></div>

    <div class="trust-section">
        <div class="trust-item">

        </div>
        <div class="trust-item">
            <div class="trust-icon">&#10003;</div>
            <div class="trust-text">正品保障</div>
        </div>
        <div class="trust-item">
            <div class="trust-icon">&#8635;</div>

        </div>
        <div class="trust-item">

    <div class="detail-section">

        <span class="bi">&#9993;</span>

    </button>

    <button class="btn-buy">立即购买</button>

<script>
(function() {
    var carousel = document.getElementById('carousel');
    var dots = document.querySelectorAll('.dot');
    var slides = document.querySelectorAll('.slide');
    var current = 0;
    var startX = 0;
    var timer = null;

    function goTo(index) {
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        current = index;
        carousel.style.transform = 'translateX(-' + (current * 100) + '%)';
        dots.forEach(function(d, i) { d.classList.toggle('active', i === current); });
    }

    dots.forEach(function(dot, i) {
        dot.addEventListener('click', function() { goTo(i); resetTimer(); });
    });

    carousel.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        clearInterval(timer);
    }, {passive: true});

    carousel.addEventListener('touchend', function(e) {
        var diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) goTo(current + 1); else goTo(current - 1);
        }
        resetTimer();
    }, {passive: true});

    function resetTimer() {
        clearInterval(timer);
        timer = setInterval(function() { goTo(current + 1); }, 4000);
    }
    resetTimer();
})();
</script>

</body>
</html>
